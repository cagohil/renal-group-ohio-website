<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Salem Regional Medical Center Logo -->
  <g id="srmc-icon" transform="translate(10, 8)">
    <!-- Medical Cross with gold healing arc -->
    <rect x="22" y="4" width="18" height="56" rx="4" fill="#003566"/>
    <rect x="3" y="23" width="56" height="18" rx="4" fill="#003566"/>
    <!-- Golden radiant swoop -->
    <path d="M 6 52 C 24 64, 48 56, 58 32 C 60 26, 62 16, 56 12 C 50 8, 44 18, 40 28 C 34 44, 20 48, 6 52 Z" fill="#d4af37" opacity="0.95"/>
    <circle cx="31" cy="32" r="5" fill="#ffffff"/>
  </g>
  <g id="srmc-text" transform="translate(82, 22)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="900" fill="#003566" letter-spacing="-0.01em">SALEM REGIONAL</text>
    <text x="0" y="33" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1e3a5f" letter-spacing="0.08em">MEDICAL CENTER</text>
    <text x="0" y="46" font-family="'Inter', sans-serif" font-size="9" font-style="italic" font-weight="600" fill="#c49746" letter-spacing="0.03em">To Serve. To Care. To Heal.</text>
  </g>
</svg>
